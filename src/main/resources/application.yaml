spring:
  ai:
    gigachat:
      auth:
        bearer:
          client-id: ${CLIENT_ID}
          api-key: ${API_KEY}
        scope: GIGACHAT_API_PERS
        unsafe-ssl: true
      chat:
        options:
          model: GigaChat
          temperature: 0.5
          top-p: 0.5
          max-tokens: 200
          repetition-penalty: 1
          update-interval: 0
      embedding:
        options:
          model: Embeddings
          dimensions: 1024
      internal:
        connect-timeout: 15s
        read-timeout: 15s
        make-system-prompt-first-message-in-memory: true

